---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mtpc/public_html/agent/
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/cp -R api/* $DEPLOYPATH/api/
    - /bin/cp -f api/chat56.php $DEPLOYPATH/api/chat.php
    - /bin/cp -f api/live-token56.php $DEPLOYPATH/api/live-token.php
    - /bin/cp -f api/tts56.php $DEPLOYPATH/api/tts.php
    - /bin/mkdir -p /home/mtpc/public_html/admin
    - /bin/cp -R admin/* /home/mtpc/public_html/admin/
    - /bin/mkdir -p /home/mtpc/public_html/admin/api
    - /bin/cp -f api/chat56.php /home/mtpc/public_html/admin/api/chat.php
    - /bin/cp -f api/live-token56.php /home/mtpc/public_html/admin/api/live-token.php
    - /bin/cp -f admin/api/students.php /home/mtpc/public_html/admin/api/students.php
    - /bin/cp -f admin/api/operations.php /home/mtpc/public_html/admin/api/operations.php
    - /bin/cp -f admin/api/email.php /home/mtpc/public_html/admin/api/email.php
    - /bin/mkdir -p /home/mtpc/public_html/moodle/public/local/mtpcbridge
    - /bin/cp -R moodle-plugin/local/mtpcbridge/* /home/mtpc/public_html/moodle/public/local/mtpcbridge/
